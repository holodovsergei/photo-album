<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    /* Базовые настройки страницы */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; font-family: sans-serif; }
    
    /* ------------------------------------- */
    /* 1. Настройки заднего фона (Сетка фото)*/
    /* ------------------------------------- */
    .background-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: grid;
      /* Автоматически создаем колонки. Меняй 200px, чтобы сделать фото мельче или крупнее */
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 5px; /* Отступы между фото в сетке */
      z-index: 1;
      opacity: 0.3; /* Затемняем фон, чтобы выделить главное фото */
      pointer-events: none; /* Чтобы фон не реагировал на клики */
    }
    
    /* Обрезаем фото в сетке, чтобы они были ровными квадратами/прямоугольниками */
    .background-grid img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ------------------------------------- */
    /* 2. Настройки переднего плана (Карусель)*/
    /* ------------------------------------- */
    .container {
      position: relative;
      z-index: 10; /* Размещаем карусель ПОВЕРХ фона */
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
    }
    
    .carousel { 
      position: relative; 
      width: 100%; 
      max-width: 600px; /* Ширина главного фото */
      overflow: hidden; 
      border-radius: 12px; 
      box-shadow: 0 15px 40px rgba(0,0,0,0.8); /* Красивая тень под главным фото */
    }
    
    .slides { display: flex; transition: transform 0.5s ease-in-out; }
    .slide { min-width: 100%; box-sizing: border-box; }
    .slide img { width: 100%; display: block; border-radius: 12px; }
    
    /* Кнопки перелистывания */
    .btn { 
      position: absolute; top: 50%; transform: translateY(-50%); 
      background: rgba(0,0,0,0.6); color: white; border: none; 
      padding: 12px 18px; cursor: pointer; border-radius: 50%; 
      font-size: 20px; transition: 0.3s; 
    }
    .btn:hover { background: rgba(0,0,0,0.9); }
    .prev { left: 10px; }
    .next { right: 10px; }
  </style>
</head>
<body>

  <!-- ================= ЗАДНИЙ ФОН (СЕТКА) ================= -->
  <!-- Если меняешь ссылки на свои фото, обязательно поменяй их и здесь, и ниже в карусели! -->
  <div class="background-grid">
    <img src="https://picsum.photos/800/450?random=1">
    <img src="https://picsum.photos/800/450?random=2">
    <img src="https://picsum.photos/800/450?random=3">
    <img src="https://picsum.photos/800/450?random=4">
    <img src="https://picsum.photos/800/450?random=5">
    <img src="https://picsum.photos/800/450?random=6">
    <img src="https://picsum.photos/800/450?random=7">
    <img src="https://picsum.photos/800/450?random=8">
  </div>

  <!-- ================= ПЕРЕДНИЙ ПЛАН (КАРУСЕЛЬ) ================= -->
  <div class="container">
    <div class="carousel">
      <div class="slides" id="slides">
        <div class="slide"><img src="https://picsum.photos/800/450?random=1"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=2"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=3"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=4"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=5"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=6"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=7"></div>
        <div class="slide"><img src="https://picsum.photos/800/450?random=8"></div>
      </div>
      <button class="btn prev" onclick="moveSlide(-1)">&#10094;</button>
      <button class="btn next" onclick="moveSlide(1)">&#10095;</button>
    </div>
  </div>

  <!-- ================= СКРИПТ КАРУСЕЛИ ================= -->
  <script>
    let currentIndex = 0;
    const slidesContainer = document.getElementById('slides');
    const totalSlides = document.querySelectorAll('.slide').length;

    function moveSlide(step) {
      currentIndex += step;
      if (currentIndex < 0) currentIndex = totalSlides - 1;
      if (currentIndex >= totalSlides) currentIndex = 0;
      slidesContainer.style.transform = `translateX(${-currentIndex * 100}%)`;
    }
  </script>
</body>
</html>
